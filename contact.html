    <header>

    <section class="hero">
      <div class="container">
        <h1>حفظ البيانات</h1>
        <p>احفظ اسمك وكودك بسهولة</p>
      </div>
    </section>

    <section class="form-section">
      <div class="container">
        <div class="form-container">
          <h2>احفظ الاسم والكود</h2>
          <form class="contact-form">
            <div class="form-group">
              <label for="name">الاسم</label>
              <input id="name" name="name" type="text" placeholder="اكتب الاسم هنا..." />
            </div>
            <div class="form-group">
              <label for="code">الكود</label>
              <textarea id="code" name="code" rows="6" placeholder="اكتب الكود هنا..."></textarea>
            </div>
            <button type="submit" class="btn">حفظ الملف</button>
            <div class="result-message" role="status"></div>
          </form>
        </div>
      </div>
    </section>

    <footer>
      <div class="container">
        <p>© 2026 Emden. جميع الحقوق محفوظة. | تصميم حديث ومتجاوب</p>
